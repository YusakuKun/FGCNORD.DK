<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="ultimateGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E60012"/>
      <stop offset="60%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#FFD200"/>
    </linearGradient>
    <filter id="ultimateShadow" x="-2" y="-2" width="404" height="124">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141413"/>
